<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CFC Receiver</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0f172a;overflow:hidden;
    font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
  /* ─── 上下分区：上方相机取景区 + 下方独立进度面板，两者互不遮挡 ─── */
  body{display:flex;flex-direction:column;box-sizing:border-box;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 8px);}

  /* 取景区（占据剩余全部高度） */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#000;
    border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  /* 取景框十字：绿=已锁定二维码（计时中），黄=看到码但未解出，白=未识别 */
  .crosshair{position:absolute;width:20%;height:20%;border:4px solid rgba(255,255,255,.5);pointer-events:none;z-index:5;
    transition:border-color .2s;}
  .crosshair.tl{top:15%;left:15%;border-right:none;border-bottom:none;}
  .crosshair.br{bottom:15%;right:15%;border-left:none;border-top:none;}
  /* 注意顺序：recv.js 的 update_visual_state 有个上游笔误，可能给 crosshair2
     同时留下两个 class，把 active 放后面保证"已锁定"的绿色优先 */
  .crosshair.scanning_xhairs{border-color:#fbbf24;}
  .crosshair.active_xhairs{border-color:#34d399;}

  /* ─── 进度面板：进度 / 模式 / 计时 / 文件名（独立占位，不覆盖画面） ─── */
  #hud{flex:0 0 auto;margin-top:10px;padding:12px 14px 13px;box-sizing:border-box;color:#e2e8f0;
    background:#111c33;border:1px solid rgba(148,163,184,.16);border-radius:16px;}
  #hudTop{display:flex;align-items:center;justify-content:space-between;}
  #hudTitle{font-size:13px;font-weight:800;color:#60a5fa;letter-spacing:.3px;}
  #hudRight{display:flex;gap:8px;align-items:center;}
  /* 计时器：按 phase 着色 —— 灰=等待首次识别，蓝=计时中，黄=已暂停，绿=已完成 */
  #hudTimer{font-size:12px;font-family:ui-monospace,monospace;font-weight:700;color:#93c5fd;}
  #hudTimer.boot,#hudTimer.idle{color:#64748b;}
  #hudTimer.running{color:#93c5fd;}
  #hudTimer.paused{color:#fbbf24;}
  #hudTimer.done{color:#34d399;}
  /* 手工重置按钮 */
  #hudReset{font:inherit;font-size:11px;font-weight:700;color:#e2e8f0;padding:4px 10px;
    border:1px solid rgba(148,163,184,.35);background:rgba(148,163,184,.12);border-radius:999px;
    -webkit-appearance:none;cursor:pointer;}
  #hudReset:active{background:rgba(148,163,184,.32);}
  #hudMode{font-size:10px;font-family:ui-monospace,monospace;font-weight:700;color:#c084fc;padding:2px 8px;
    background:rgba(192,132,252,0.15);border-radius:6px;display:none;}
  /* 进度条 + 百分比同行 */
  #hudProg{display:flex;align-items:center;gap:10px;margin:10px 0 8px;}
  #hudBar{flex:1 1 auto;height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;}
  #hudBarFill{height:100%;background:linear-gradient(90deg,#3b82f6,#10b981);width:0%;
    border-radius:5px;transition:width .2s;}
  #hudPercent{flex:0 0 auto;min-width:48px;text-align:right;
    font-size:18px;font-family:ui-monospace,monospace;font-weight:800;color:#34d399;}
  /* 文件名 & 状态 */
  #hudFileName{font-size:12px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none;}
  #hudStatus{font-size:11px;color:#94a3b8;margin-top:3px;}

  /* 启动遮罩（仅覆盖取景区，进度面板始终可见） */
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:rgba(15,23,42,.78);z-index:30;color:#e2e8f0;text-align:center;padding:24px;box-sizing:border-box;}
  #startBtn{padding:16px 34px;border:none;border-radius:16px;background:#3b82f6;color:#fff;
    font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(59,130,246,.4);cursor:pointer;}
  #startBtn:active{opacity:.8;}
  #overlayText{font-size:15px;font-weight:600;}
</style>
</head>
<body>
  <!-- ═══ 上方：相机取景区（启动遮罩内嵌于此，不遮挡下方进度面板）═══ -->
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="crosshair1" class="crosshair tl"></div>
    <div id="crosshair2" class="crosshair br"></div>

    <div id="overlay">
      <div id="overlayText">正在启动解码引擎…</div>
      <button id="startBtn" style="display:none;">📷 开始接收</button>
    </div>
  </div>

  <!-- ═══ 下方：实时进度面板 ═══ -->
  <div id="hud">
    <div id="hudTop"><span id="hudTitle">CFC 扫码接收</span>
      <div id="hudRight"><span id="hudMode"></span><span id="hudTimer" class="boot">⏱ 00:00</span>
        <button id="hudReset" type="button">↺ 重置</button></div>
    </div>
    <div id="hudProg">
      <div id="hudBar"><div id="hudBarFill"></div></div>
      <span id="hudPercent">0%</span>
    </div>
    <div id="hudFileName"></div>
    <div id="hudStatus">📷 准备中…</div>
  </div>

  <!-- recv.js 隐藏 DOM -->
  <div id="framesInFlight" style="display:none;">0</div>
  <div id="t0" style="display:none;"></div><div id="t1" style="display:none;"></div>
  <div id="t2" style="display:none;"></div><div id="t3" style="display:none;"></div>
  <div id="tdec" style="display:none;"></div><div id="errorbox" style="display:none;"></div>
  <div id="progress_bars" style="display:none;"><div class="progress"></div></div>
  <div id="nav-container" class="mode-auto" style="display:none;"><a id="mode-val" href="javascript:void(0)">B</a></div>
  <div id="nav-button" style="display:none;"></div><div id="nav-content" style="display:none;"></div>
  <div id="debug-button" style="display:none;"></div>

<script>
  // ============ 原生桥（兜底：供原生 HUD 轮询 / 最终文件回传） ============
  function postNative(name, obj){
    try{ if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers[name])
           window.webkit.messageHandlers[name].postMessage(obj); }catch(e){}
  }

  // ============ 内 HUD（实时，不依赖原生桥） ============
  // phase 状态机：
  //   boot    引擎/相机启动中，状态行由 setHUDStatus 直接控制
  //   idle    相机已就绪，等待首次识别到二维码（计时器停在 00:00）
  //   running 已锁定二维码，计时中
  //   paused  目标丢失（镜头移开），计时冻结，重新识别后自动续计
  //   done    文件接收完成，计时停在总耗时
  var HUD={percent:0, streams:0, mode:'', fileName:'', status:'', detail:'',
           phase:'boot', locked:false, accumMs:0, segStart:0, lastFrameAt:0,
           tickId:null, timerSec:0, _lastMode:0};
  var $=function(id){return document.getElementById(id);};

  function setPercent(p, streams){
    HUD.percent=p; HUD.streams=streams;
    $('hudPercent').textContent=p+'%';
    $('hudBarFill').style.width=p+'%';
  }
  function setMode(m){ HUD.mode=m; var e=$('hudMode'); e.textContent='模式:'+m; e.style.display=m?'inline-block':'none'; }
  function setFileName(n){ HUD.fileName=n; var e=$('hudFileName'); e.textContent=n; e.style.display=n?'block':'none'; }
  function setHUDStatus(s){ HUD.status=s; $('hudStatus').textContent=s; }

  // ── 计时：累计毫秒 + 当前计时段起点，暂停/续计不丢精度 ──
  function elapsedMs(){ return HUD.accumMs + (HUD.segStart ? Date.now()-HUD.segStart : 0); }
  function freezeTimer(){ if(HUD.segStart){ HUD.accumMs+=Date.now()-HUD.segStart; HUD.segStart=0; } }

  function renderTimer(){
    var sec=Math.floor(elapsedMs()/1000); HUD.timerSec=sec;
    var icon = HUD.phase==='paused' ? '⏸' : (HUD.phase==='done' ? '✅' : '⏱');
    var e=$('hudTimer');
    e.textContent=icon+' '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
    e.className=HUD.phase;
  }

  function tickOnce(){
    // 帧回调断流（相机停摆/被完全遮挡/App 切后台）超过 1.5s 也按丢失目标处理
    if(HUD.locked && HUD.lastFrameAt && Date.now()-HUD.lastFrameAt>1500) setLocked(false);
    renderTimer();
  }
  function startTick(){ if(HUD.tickId) return; HUD.tickId=setInterval(tickOnce,500); }
  function stopTick(){ if(HUD.tickId){clearInterval(HUD.tickId);HUD.tickId=null;} }

  // 由 Recv.update_visual_state 每帧驱动：on=最近 30 帧内成功解出过数据
  function setLocked(on){
    if(HUD.locked===on) return;
    HUD.locked=on;
    if(HUD.phase==='done'||HUD.phase==='boot') return;
    if(on){
      HUD.segStart=Date.now(); HUD.phase='running';
    }else{
      freezeTimer();
      HUD.phase = HUD.accumMs>0 ? 'paused' : 'idle';
    }
    renderTimer(); refreshStatus();
  }

  // 状态行的唯一出口，避免解码进度与暂停提示互相覆盖
  function refreshStatus(){
    if(HUD.phase==='boot') return;
    if(HUD.phase==='done'){ setHUDStatus('✅ 接收完成：'+HUD.fileName); return; }
    if(HUD.phase==='idle'){ setHUDStatus('📷 请对准二维码，识别后自动开始计时'); return; }
    if(HUD.phase==='paused'){ setHUDStatus('⏸ 已暂停 · 未识别到二维码，请重新对准'); return; }
    setHUDStatus(HUD.detail||'🔍 已锁定，正在接收…');
  }

  // 把当前进度同步给原生（供弱更新时的兜底）
  function syncToNative(){
    postNative('progress',{percent:HUD.percent,streams:HUD.streams});
    postNative('status',{status:HUD.status,mode:HUD.mode,fileName:HUD.fileName,timerSec:HUD.timerSec});
  }

  // ============ WASM Module ============
  var Module = {};
  Module.onRuntimeInitialized = function(){
    console.log('[harness] wasm ready');
    setHUDStatus('WASM 已就绪，初始化 Worker…');
    try{ boot(); }catch(e){ console.error('[harness] boot error',e); showStartButton('初始化失败：'+e.message); }
  };

  window.addEventListener('error',function(e){
    setHUDStatus('JS 错误：'+e.message);
    postNative('jslog',{level:'error',msg:'Uncaught '+e.message+' @'+(e.filename||'')+':'+(e.lineno||'')});
  });

  var _started=false;
  async function boot(){
    if(_started) return; _started=true;
    var NUM_WORKERS=3;
    Recv.init_ww(NUM_WORKERS);

    // ── 劫持进度：更新内 HUD（实时，不依赖原生桥）──
    var origRender=Recv.render_progress;
    Recv.render_progress=function(report){
      try{origRender.call(Recv,report);}catch(e){}
      if(Array.isArray(report)&&report.length){
        var avg=Math.min(1.0,report.reduce(function(a,b){return a+b;},0)/report.length);
        setPercent(Math.round(avg*100),report.length);
        HUD.detail='解码中… '+Math.round(avg*100)+'% · '+report.length+' 流';
        refreshStatus();
        // 低频同步原生（约每秒）
        if(!HUD._lastSync||Date.now()-HUD._lastSync>800){HUD._lastSync=Date.now();syncToNative();}
      }
    };

    // ── 劫持错误上报：getUserMedia 是异步 reject，startCamera 的 try/catch 抓不到，
    //    recv.js 只会把错误写进隐藏的 #errorbox，用户会永远停在"请对准二维码" ──
    var origSetError=Recv.set_error;
    Recv.set_error=function(msg){
      var r; try{ r=origSetError.call(Recv,msg); }catch(e){}
      console.error('[harness] recv error: '+msg);
      stopTick(); HUD.phase='boot';
      setHUDStatus('❌ '+msg);
      showStartButton('相机启动失败：'+msg);
      postNative('status',{status:'相机启动失败：'+msg});
      return r;
    };

    // ── 劫持每帧的视觉状态刷新：驱动"识别到码才计时 / 丢失则暂停" ──
    // 引入迟滞消抖 (Hysteresis Debounce) 衰减缓冲区 (1000ms)，消除手抖与屏幕闪烁导致的频繁跳变
    var origVisual=Recv.update_visual_state;
    var _lastSuccessAt=0;
    var HOLD_TIMEOUT_MS=1000;

    Recv.update_visual_state=function(){
      HUD.lastFrameAt=Date.now();
      try{origVisual.call(Recv);}catch(e){}
      var isActive = $('crosshair1').classList.contains('active_xhairs');
      if (isActive) {
        _lastSuccessAt = Date.now();
        setLocked(true);
      } else {
        // 若单帧未解出，保持锁定 1000ms 衰减缓冲，超时后才判定为真正移开暂停
        if (HUD.locked && (Date.now() - _lastSuccessAt > HOLD_TIMEOUT_MS)) {
          setLocked(false);
        }
      }
    };

    // ── 劫持模式锁定 ──
    var origSetMode=Recv.setMode;
    Recv.setMode=function(m){
      origSetMode.call(Recv,m);
      if(m>0&&m!==HUD._lastMode){HUD._lastMode=m;setMode(({4:'4C',66:'Bu',67:'Bm',68:'B'})[m]||('#'+m));syncToNative();}
    };

    // ── 劫持下载 ──
    Zstd.download_blob=function(name,blob){
      freezeTimer(); HUD.phase='done'; renderTimer();
      setFileName(name); refreshStatus();
      postNative('fileMeta',{name:name,size:blob.size});
      blob.arrayBuffer().then(function(ab){
        var u8=new Uint8Array(ab),bin='',CH=0x8000;
        for(var i=0;i<u8.length;i+=CH) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
        postNative('fileComplete',{name:name,size:blob.size,data:btoa(bin)});
      });
    };

    await Recv.ww_ready;
    console.log('[harness] workers ready');
    if(typeof Sink!=='undefined') Sink.allocate();
    startCamera();
  }

  function startCamera(){
    try{
      Recv.init_video(document.getElementById('video'));
      console.log('[harness] init_video ok');
      hideOverlay();
      // 相机就绪 ≠ 开始计时：进入 idle，等第一次真正解出数据才起表
      HUD.phase='idle'; renderTimer(); refreshStatus(); startTick();
      postNative('cameraStarted',{});
    }catch(e){
      console.error('[harness] init_video failed',e);
      showStartButton('无法启动相机：'+e.message);
    }
  }

  // 软复位：清空进度面板与计时、模式回 Auto，相机不断流，立即等待下一次识别。
  // 原生在关闭"接收完成"预览后调用，页面内也可复用。
  window.__cfcResetHUD=function(){
    HUD.accumMs=0; HUD.segStart=0; HUD.locked=false; HUD.detail=''; HUD._lastMode=0; _lastSuccessAt=0;
    HUD.phase = (HUD.phase==='boot') ? 'boot' : 'idle';
    setPercent(0,0); setFileName(''); setMode('');
    try{ if(window.Recv&&Recv.setMode) Recv.setMode(0); }catch(e){}   // 模式回自动探测
    renderTimer(); refreshStatus(); startTick();
    return 'ok';
  };

  // 硬复位：重新加载页面。wasm 未导出解码器 reset，只有重建 Module / Worker /
  // fountain sink / 相机才能真正回到初始状态，因此手工重置走这条路。
  window.__cfcHardReset=function(){
    stopTick();
    HUD.phase='boot';
    setHUDStatus('↺ 正在重置…');
    setTimeout(function(){ location.reload(); },0);
    return 'ok';
  };

  // 暴露给原生轮询
  window.__cfcGetState=function(){
    return JSON.stringify({percent:HUD.percent,streams:HUD.streams,mode:HUD.mode,
      fileName:HUD.fileName,status:HUD.status,timerSec:HUD.timerSec,phase:HUD.phase});
  };

  function hideOverlay(){ var o=$('overlay'); if(o) o.style.display='none'; }
  function showStartButton(msg){
    $('overlayText').textContent=msg||'点击开始接收'; $('startBtn').style.display='inline-block';
    $('overlay').style.display='flex';
  }
  document.addEventListener('DOMContentLoaded',function(){
    // 重试必须整页重载，不能重入 boot()：recv.js 的 init_ww 只清空 _workers 数组
    // 而不 terminate 旧 worker（每个各带一份 wasm 实例），几个劫持也会逐层叠加，
    // 且 ww_ready 已 settle 会让 startCamera 抢在新 worker 就绪之前跑。
    $('startBtn').addEventListener('click',function(){
      $('startBtn').style.display='none';
      $('overlayText').textContent='正在重试…';
      setTimeout(function(){ location.reload(); },0);
    });
    $('hudReset').addEventListener('click',function(){ window.__cfcHardReset(); });
  });
  setTimeout(function(){if(!_started){setHUDStatus('引擎加载较慢…');}},5000);
</script>

<script src="cimbar-deps/cimbar_js.2026-01-20T0312.js"></script>
<script src="cimbar-deps/zstd.2026-01-20T0312.js"></script>
<script src="cimbar-deps/recv.2026-01-20T0312.js"></script>
</body>
</html>
